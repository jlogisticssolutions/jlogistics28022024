name: Static site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static website files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check required website files
        run: |
          test -f index.html
          test -f css/style.css
          test -f css/responsive.css
      - name: Check for retired vulnerable library references
        run: |
          if grep -R -n -E 'js/jquery\.1\.11\.1\.js|js/bootstrap\.js|css/bootstrap\.css' --include='*.html' .; then
            echo "A retired local library reference remains."
            exit 1
          fi
          if grep -R -n 'http://fonts.googleapis.com' --include='*.html' .; then
            echo "An insecure Google Fonts URL remains."
            exit 1
          fi
